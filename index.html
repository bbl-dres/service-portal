<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BBL Kundenportal</title>
  <meta name="description" content="BBL Kundenportal — Prototyp. Dienstleistungen, Anwendungen, Dokumente und Daten des Bundesamts für Bauten und Logistik an einem Ort.">
  <!-- Nur die beiden Schnitte, die tatsächlich geladen werden (document.fonts:
       Regular + Bold `loaded`, beide Kursiven `unloaded`). -->
  <link rel="preload" href="assets/fonts/NotoSans-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/NotoSans-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="body--intranet">
  <header id="main-header"></header>
  <!-- Datenausfall-Band (P0-4): von js/app.js nach dem Laden befüllt, wenn eine
       data/*.json fehlt. Persistent, weil der Router nur #main-content neu zeichnet. -->
  <div id="data-status" role="alert"></div>
  <main id="main-content" tabindex="-1"></main>
  <!-- Persistente Live-Region: Router/Katalogseiten schreiben hier Treffer-,
       Ansichts- und Seitenwechsel hinein (WCAG 4.1.3). Nur Text mutieren. -->
  <div id="live" role="status" aria-live="polite" class="sr-only"></div>
  <footer id="main-footer"></footer>
  <!-- Hinweisstreifen (CD notification-banner), am Seitenende: fix positioniert,
       liegt damit in der Lesereihenfolge NACH dem Inhalt. -->
  <div id="banner-host"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
